<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合并报表专家助手</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C8993A;
  --gold-light: #E8C47A;
  --gold-dark: #8B6520;
  --navy: #1A2B4A;
  --navy-light: #2A4070;
  --bg: #F4F2EC;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text-muted: #6B7280;
  --border: #E5DDD0;
  --red: #DC2626;
  --green: #16A34A;
}
* { box-sizing: border-box; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
h1,h2,h3,h4 { font-family: 'Noto Serif SC', serif; }
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(200,152,58,.4); }
.btn-gold:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-outline { background: white; color: var(--gold-dark); border: 1.5px solid var(--gold); padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-outline:hover { background: #FFF9ED; }
.input-field { border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; width: 100%; font-size: 14px; transition: border-color .2s; background: white; }
.input-field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,152,58,.15); }
.input-number { text-align: right; font-family: 'Courier New', monospace; }
table { border-collapse: collapse; width: 100%; }
th { background: var(--navy); color: white; padding: 8px 12px; text-align: left; font-size: 13px; }
td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
tr:hover { background: #FDF9F3; }
.number-cell { text-align: right; font-family: 'Courier New', monospace; color: var(--navy); }
.subtotal-row { background: #F9F6F0 !important; font-weight: 600; }
.total-row { background: var(--navy) !important; color: white; }
.elimination-row { background: #FFF5F5; border-left: 3px solid var(--red); }
.consolidated-row { background: #F0FFF4; border-left: 3px solid var(--green); font-weight: 600; }
.step-card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); border: 1px solid var(--border); }
.step-indicator { display: flex; align-items: center; gap: 8px; }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--border); color: var(--text-muted); }
.step-dot.active { background: var(--gold); color: white; }
.step-dot.done { background: var(--green); color: white; }
.step-line { flex: 1; height: 2px; background: var(--border); }
.step-line.done { background: var(--gold); }
.sidebar { background: var(--navy); color: white; min-height: 100vh; padding: 24px 16px; position: sticky; top: 0; }
.sidebar h2 { color: var(--gold-light); font-size: 18px; margin-bottom: 4px; }
.sidebar-sub { color: rgba(255,255,255,.6); font-size: 12px; margin-bottom: 24px; }
.nav-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; transition: background .2s; color: rgba(255,255,255,.75); }
.nav-item:hover { background: rgba(255,255,255,.1); }
.nav-item.active { background: rgba(200,152,58,.3); color: var(--gold-light); font-weight: 600; }
.nav-item.done { color: rgba(255,255,255,.45); }
.tab-btn { padding: 8px 20px; border-radius: 20px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; }
.tab-btn.active { background: var(--gold); color: white; border-color: var(--gold); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-red { background: #FEE2E2; color: var(--red); }
.badge-green { background: #DCFCE7; color: var(--green); }
.badge-gold { background: #FEF3C7; color: #92400E; }
.expert-card { background: linear-gradient(135deg, #1A2B4A, #2A4070); color: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.expert-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: white; border-radius: 16px; padding: 32px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
.file-drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all .2s; }
.file-drop:hover { border-color: var(--gold); background: #FFF9ED; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: white; padding: 14px 24px; border-radius: 12px; font-size: 14px; z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.accordion-header { background: #F9F8F5; padding: 12px 16px; cursor: pointer; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.accordion-header:hover { background: #F0EDE6; }
.elimination-entry { background: #FFF5F5; border: 1px solid #FCA5A5; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.print-btn { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
@media print {
  .no-print { display: none !important; }
  body { background: white; }
}
</style>
</head>
<body>
<div id="app" style="display:flex; min-height:100vh;">
  <!-- Left Sidebar -->
  <aside class="sidebar" style="width:260px; flex-shrink:0;">
    <div style="text-align:center; margin-bottom:24px;">
      <div style="font-size:32px; margin-bottom:8px;">📊</div>
      <h2>合并报表助手</h2>
      <div class="sidebar-sub">资深财务合并报表专家</div>
    </div>
    <div id="nav-steps"></div>
    <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.15);">
      <div style="font-size:11px; color:rgba(255,255,255,.4); text-align:center;">
        合并报表专家助手 v1.0<br>Powered by AI
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main style="flex:1; padding:32px; overflow-y:auto;">
    <div id="main-content"></div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<script>
// ===== STATE MANAGEMENT =====
const defaultState = () => ({
  currentStep: 0,
  companies: [
    { id: 'p', name: '母公司', shortName: '母公司', type: 'parent', ownership: 100, equity: { shareCapital: 0, capitalReserve: 0, surplusReserve: 0, unappropriatedProfit: 0 } },
    { id: 's1', name: '子公司A', shortName: '子公司A', type: 'subsidiary', ownership: 80, equity: { shareCapital: 0, capitalReserve: 0, surplusReserve: 0, unappropriatedProfit: 0 } },
    { id: 's2', name: '子公司B', shortName: '子公司B', type: 'subsidiary', ownership: 100, equity: { shareCapital: 0, capitalReserve: 0, surplusReserve: 0, unappropriatedProfit: 0 } },
  ],
  pl: {}, // profit & loss per company
  bs: {}, // balance sheet per company
  cf: {}, // cash flow per company
  equity: {}, // equity changes per company
  ic: { // intercompany
    sales: [],    // { from: id, to: id, amount: 0 }
    arap: [],     // { from: id, to: id, amount: 0 }
    dividends: [], // { from: id, to: id, amount: 0 }
    inventory: [], // { from: id, to: id, amount: 0, unrealizedProfit: 0 }
    fixedAsset: [], // { from: id, to: id, amount: 0 }
  },
  eliminations: [], // auto-generated + manual
  consolidated: {},
  aiExplanations: [],
  groupName: '集团有限公司',
  reportPeriod: '2015年',
  balanceDate: '2015-12-31',
});

let state = defaultState();

function initStatements() {
  state.companies.forEach(c => {
    if (!state.pl[c.id]) state.pl[c.id] = {
      revenue: 0, COGS: 0, taxAndSurcharge: 0, sellingExpense: 0, adminExpense: 0, financeExpense: 0,
      impairmentLoss: 0, fairValueChange: 0, investmentIncome: 0, nonOperatingIncome: 0, nonOperatingExpense: 0,
      incomeTax: 0, netProfit: 0, priorUndistributed: 0, endingUndistributed: 0,
      parentNetProfit: 0, minorityProfit: 0,
      // 利润表附注
      grossProfit: 0, operatingProfit: 0, totalProfit: 0,
    };
    if (!state.bs[c.id]) state.bs[c.id] = {
      // 资产
      monetaryFunds: 0, tradingFinancial: 0, notesReceivable: 0, accountsReceivable: 0,
      otherReceivables: 0, prepayment: 0, inventory: 0, nonCurrentAssetDue: 0, otherCurrentAssets: 0,
      currentAssetsTotal: 0,
      availableFinancial: 0, heldToMaturity: 0, longTermReceivable: 0, longTermEquity: 0,
      investmentProperty: 0, fixedAssets: 0, constructionInProgress: 0, intangibleAssets: 0,
      goodwill: 0, deferredTax: 0, otherNonCurrentAssets: 0, nonCurrentAssetsTotal: 0,
      assetsTotal: 0,
      // 负债
      shortTermBorrowing: 0, tradingFinancialLiab: 0, notesPayable: 0, accountsPayable: 0,
      advanceReceipts: 0, payrollPayable: 0, taxPayable: 0, interestPayable: 0, dividendPayable: 0,
      otherPayables: 0, nonCurrentLiabDue: 0, otherCurrentLiab: 0, currentLiabTotal: 0,
      longTermBorrowing: 0, bondsPayable: 0, longTermPayable: 0, deferredTaxLiab: 0,
      otherNonCurrentLiab: 0, nonCurrentLiabTotal: 0, liabTotal: 0,
      // 所有者权益
      shareCapital: 0, capitalReserve: 0, treasuryStock: 0, surplusReserve: 0,
      unappropriatedProfit: 0, parentEquityTotal: 0, minorityInterest: 0, equityTotal: 0,
    };
    if (!state.cf[c.id]) state.cf[c.id] = {
      // 经营活动
      cashFromSales: 0, taxRefund: 0, otherOperatingCash: 0, operatingCashInflow: 0,
      cashForGoods: 0, cashForEmployees: 0, cashForTaxes: 0, otherOperatingCashOut: 0, operatingCashOutflow: 0,
      operatingNetCash: 0,
      // 投资活动
      disposalOfAssets: 0, investmentIncomeCash: 0, otherInvestingCashIn: 0, investingCashInflow: 0,
      acquisitionOfAssets: 0, investmentPayments: 0, acquisitionOfSubsidiary: 0, otherInvestingCashOut: 0, investingCashOutflow: 0,
      investingNetCash: 0,
      // 筹资活动
      absorptionInvestment: 0, borrowingsReceived: 0, otherFinancingCashIn: 0, financingCashInflow: 0,
      debtRepayment: 0, dividendPayment: 0, financingCashOutflow: 0, financingNetCash: 0,
      effectOfFx: 0, netIncreaseInCash: 0, beginningCash: 0, endingCash: 0,
    };
    if (!state.equity[c.id]) state.equity[c.id] = {
      // 归属于母公司所有者权益
      sc_start: 0, cr_start: 0, ts_start: 0, sr_start: 0, up_start: 0, total_start: 0,
      netProfit: 0, otherComprehensive: 0, ownerContribution: 0, ownerDistribution: 0, internalTransfer: 0,
      sc_end: 0, cr_end: 0, ts_end: 0, sr_end: 0, up_end: 0, parentTotal_end: 0,
      minorityEquity_end: 0, totalEquity_end: 0,
    };
  });
}

// ===== NAVIGATION =====
const STEPS = [
  { id: 'structure', icon: '🏢', title: '公司架构设置', desc: '设置母子公司及持股比例' },
  { id: 'statements', icon: '📋', title: '单体报表录入', desc: '录入各公司财务报表' },
  { id: 'ic', icon: '🔄', title: '内部交易抵销', desc: '录入内部往来及交易' },
  { id: 'elimination', icon: '⚙️', title: '抵销分录计算', desc: '自动生成抵销分录' },
  { id: 'result', icon: '📊', title: '合并报表输出', desc: '查看合并财务报表' },
  { id: 'template', icon: '📥', title: '模板下载/上传', desc: 'Excel模板导入导出' },
];

function renderNav() {
  const nav = document.getElementById('nav-steps');
  nav.innerHTML = STEPS.map((s, i) => {
    const isActive = i === state.currentStep;
    const isDone = i < state.currentStep;
    return `
      <div class="nav-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}"
           onclick="goToStep(${i})" style="margin-bottom:4px;">
        <span style="font-size:18px;">${s.icon}</span>
        <div>
          <div style="font-size:13px; font-weight:600;">${s.title}</div>
          <div style="font-size:11px; opacity:0.7;">${s.desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== FORMAT & UTILS =====
const fmt = (n) => {
  if (n === 0 || n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + '亿';
  if (abs >= 1e4) return sign + (abs / 1e4).toFixed(2) + '万';
  return sign + abs.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
};
const fmtFull = (n) => n === 0 || n === null ? '—' : n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const parseNum = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// ===== CONSOLIDATION ENGINE =====
function calculateConsolidated() {
  const subs = state.companies.filter(c => c.type === 'subsidiary');
  const parent = state.companies.find(c => c.type === 'parent');
  
  // 初始化合并抵销结果
  const result = {
    pl: { revenue: 0, COGS: 0, taxAndSurcharge: 0, sellingExpense: 0, adminExpense: 0, financeExpense: 0,
          impairmentLoss: 0, fairValueChange: 0, investmentIncome: 0, nonOperatingIncome: 0, nonOperatingExpense: 0,
          incomeTax: 0, netProfit: 0, grossProfit: 0, operatingProfit: 0, totalProfit: 0,
          parentNetProfit: 0, minorityProfit: 0 },
    bs: { monetaryFunds: 0, tradingFinancial: 0, notesReceivable: 0, accountsReceivable: 0,
          otherReceivables: 0, prepayment: 0, inventory: 0, nonCurrentAssetDue: 0, otherCurrentAssets: 0, currentAssetsTotal: 0,
          availableFinancial: 0, heldToMaturity: 0, longTermReceivable: 0, longTermEquity: 0,
          investmentProperty: 0, fixedAssets: 0, constructionInProgress: 0, intangibleAssets: 0,
          goodwill: 0, deferredTax: 0, otherNonCurrentAssets: 0, nonCurrentAssetsTotal: 0, assetsTotal: 0,
          shortTermBorrowing: 0, tradingFinancialLiab: 0, notesPayable: 0, accountsPayable: 0,
          advanceReceipts: 0, payrollPayable: 0, taxPayable: 0, interestPayable: 0, dividendPayable: 0,
          otherPayables: 0, nonCurrentLiabDue: 0, otherCurrentLiab: 0, currentLiabTotal: 0,
          longTermBorrowing: 0, bondsPayable: 0, longTermPayable: 0, deferredTaxLiab: 0,
          otherNonCurrentLiab: 0, nonCurrentLiabTotal: 0, liabTotal: 0,
          shareCapital: 0, capitalReserve: 0, treasuryStock: 0, surplusReserve: 0,
          unappropriatedProfit: 0, parentEquityTotal: 0, minorityInterest: 0, equityTotal: 0 },
    cf: { operatingNetCash: 0, investingNetCash: 0, financingNetCash: 0, effectOfFx: 0, netIncreaseInCash: 0, beginningCash: 0, endingCash: 0 },
  };

  const explanations = [];

  // 1. 汇总所有公司单体报表
  state.companies.forEach(c => {
    const pl = state.pl[c.id] || {};
    const bs = state.bs[c.id] || {};
    const cf = state.cf[c.id] || {};
    const pct = c.ownership / 100;
    const isSub = c.type === 'subsidiary';
    const isMinority = isSub && c.ownership < 100;

    // P&L aggregation
    Object.keys(pl).forEach(k => {
      if (result.pl[k] !== undefined) {
        if (isSub && (k === 'netProfit' || k === 'parentNetProfit' || k === 'minorityProfit')) return;
        result.pl[k] += (pl[k] || 0);
      }
    });

    // Balance Sheet - subtract parent's investment in subsidiaries from BS
    Object.keys(bs).forEach(k => {
      if (result.bs[k] !== undefined) {
        result.bs[k] += (bs[k] || 0);
      }
    });

    // Cash Flow aggregation
    Object.keys(cf).forEach(k => {
      if (result.cf[k] !== undefined) {
        result.cf[k] += (cf[k] || 0);
      }
    });
  });

  // 2. 内部销售抵销
  let icSalesTotal = 0;
  state.ic.sales.forEach(tx => {
    const amt = parseNum(tx.amount);
    icSalesTotal += amt;
    explanations.push({
      type: '内部销售抵销', detail: `内部销售 ¥${fmtFull(amt)}：借记营业收入，贷记营业成本（含期末未实现利润 ¥${fmtFull(amt * 0.3)}）`,
      dr: '营业收入', drAmt: amt, cr: '营业成本', crAmt: amt, note: `发生在 ${state.companies.find(c=>c.id===tx.from)?.name || tx.from} → ${state.companies.find(c=>c.id===tx.to)?.name || tx.to}`
    });
  });
  result.pl.revenue -= icSalesTotal;
  result.pl.COGS -= icSalesTotal;

  // 未实现内部利润（假设30%留在存货）
  const unrealizedProfit = icSalesTotal * 0.3;
  result.pl.COGS += unrealizedProfit;
  result.bs.inventory += unrealizedProfit;
  if (icSalesTotal > 0) {
    explanations.push({
      type: '未实现内部利润', detail: `期末存货中未实现内部利润 ¥${fmtFull(unrealizedProfit)}：借记存货，贷记营业成本`,
      dr: '存货', drAmt: unrealizedProfit, cr: '营业成本', crAmt: unrealizedProfit
    });
  }

  // 3. 内部应收/应付账款抵销
  let icArapTotal = 0;
  state.ic.arap.forEach(tx => {
    const amt = parseNum(tx.amount);
    icArapTotal += amt;
    const fromCo = state.companies.find(c => c.id === tx.from);
    explanations.push({
      type: '内部往来抵销', detail: `内部应收/应付 ¥${fmtFull(amt)}：借记应付账款，贷记应收账款`,
      dr: '应付账款', drAmt: amt, cr: '应收账款', crAmt: amt,
      note: `发生在 ${fromCo?.name || tx.from} 与 ${state.companies.find(c=>c.id===tx.to)?.name || tx.to} 之间`
    });
  });
  result.bs.accountsReceivable -= icArapTotal;
  result.bs.accountsPayable -= icArapTotal;

  // 4. 内部股利分配抵销
  let icDividendsTotal = 0;
  state.ic.dividends.forEach(tx => {
    const amt = parseNum(tx.amount);
    icDividendsTotal += amt;
    const fromCo = state.companies.find(c => c.id === tx.from);
    explanations.push({
      type: '内部股利分配抵销', detail: `内部股利 ¥${fmtFull(amt)}：子公司宣告股利全额抵消`,
      dr: '应付股利', drAmt: amt, cr: '投资收益', crAmt: amt,
      note: `${fromCo?.name || tx.from} 宣告股利分配`
    });
  });

  // 5. 投资与权益抵销（核心抵销分录）
  subs.forEach(sub => {
    const bs = state.bs[sub.id] || {};
    const ownership = sub.ownership / 100;
    const minorityOwnership = 1 - ownership;
    
    const subEquity = (bs.shareCapital || 0) + (bs.capitalReserve || 0) + (bs.surplusReserve || 0) + (bs.unappropriatedProfit || 0);
    const parentInvestment = subEquity * ownership; // 简化计算
    const minorityEquity = subEquity * minorityOwnership;

    // 从BS中减去母公司的长期股权投资
    if (result.bs.longTermEquity) result.bs.longTermEquity -= parentInvestment;

    if (parentInvestment > 0 || subEquity > 0) {
      explanations.push({
        type: '投资与权益抵销', detail: `子公司 ${sub.name}（持股${sub.ownership}%）：抵销母公司长期股权投资与子公司净资产`,
        dr: '股本/资本公积/盈余公积/未分配利润', drAmt: subEquity,
        cr: '长期股权投资', crAmt: parentInvestment,
        cr2: '少数股东权益', crAmt2: minorityEquity,
        note: `母公司持股${sub.ownership}%，少数股东持股${(100-sub.ownership)}%`
      });
    }

    // 少数股东权益
    result.bs.minorityInterest += minorityEquity;

    // 少数股东损益
    const subNetProfit = parseNum(bs.parentNetProfit || state.pl[sub.id]?.netProfit || 0);
    const minorityNetProfit = subNetProfit * minorityOwnership;
    result.pl.minorityProfit += minorityNetProfit;
    result.pl.parentNetProfit += (subNetProfit * ownership);
    if (result.pl.netProfit !== undefined) {
      result.pl.netProfit -= subNetProfit;
      result.pl.netProfit += subNetProfit * ownership;
    }
  });

  // 6. 计算衍生指标
  result.pl.grossProfit = result.pl.revenue - result.pl.COGS;
  result.pl.operatingProfit = result.pl.grossProfit - result.pl.taxAndSurcharge - result.pl.sellingExpense - result.pl.adminExpense - result.pl.financeExpense - result.pl.impairmentLoss + result.pl.fairValueChange + result.pl.investmentIncome;
  result.pl.totalProfit = result.pl.operatingProfit + result.pl.nonOperatingIncome - result.pl.nonOperatingExpense;
  result.pl.netProfit = result.pl.totalProfit - result.pl.incomeTax;

  // BS总计
  result.bs.currentAssetsTotal = (result.bs.monetaryFunds||0) + (result.bs.accountsReceivable||0) + (result.bs.otherReceivables||0) + (result.bs.prepayment||0) + (result.bs.inventory||0) + (result.bs.otherCurrentAssets||0);
  result.bs.nonCurrentAssetsTotal = (result.bs.longTermEquity||0) + (result.bs.fixedAssets||0) + (result.bs.intangibleAssets||0) + (result.bs.deferredTax||0);
  result.bs.assetsTotal = result.bs.currentAssetsTotal + result.bs.nonCurrentAssetsTotal;
  result.bs.currentLiabTotal = (result.bs.accountsPayable||0) + (result.bs.shortTermBorrowing||0) + (result.bs.payrollPayable||0) + (result.bs.taxPayable||0) + (result.bs.otherPayables||0);
  result.bs.nonCurrentLiabTotal = (result.bs.longTermBorrowing||0);
  result.bs.liabTotal = result.bs.currentLiabTotal + result.bs.nonCurrentLiabTotal;
  result.bs.parentEquityTotal = (result.bs.shareCapital||0) + (result.bs.capitalReserve||0) + (result.bs.surplusReserve||0) + (result.bs.unappropriatedProfit||0);
  result.bs.equityTotal = result.bs.parentEquityTotal + result.bs.minorityInterest;

  // P&L 净利润归属
  if (result.pl.parentNetProfit === 0) {
    result.pl.parentNetProfit = result.pl.netProfit;
    result.pl.minorityProfit = 0;
  }

  state.consolidated = result;
  state.aiExplanations = explanations;
  return result;
}

function autoFillSample(companyId) {
  const isParent = state.companies.find(c => c.id === companyId)?.type === 'parent';
  const seed = isParent ? 100000 : 50000;
  
  state.pl[companyId] = {
    revenue: seed * 5 + Math.random() * seed * 2,

    adminExpense: seed * 0.5,

    impairmentLoss: seed * 0.05,

    investmentIncome: isParent ? seed * 0.4 : 0,
    nonOperatingIncome: seed * 0.05,
    nonOperatingExpense: seed * 0.02,

    netProfit: seed * 0.7,
    parentNetProfit: seed * 0.7,

  state.bs[companyId] = {

    intangibleAssets: seed * 1,
    deferredTax: seed * 0.2,
    shortTermBorrowing: seed * 2,
    accountsPayable: seed * 1.5,
    advanceReceipts: seed * 0.5,
    payrollPayable: seed * 0.4,
    taxPayable: seed * 0.3,
    otherPayables: seed * 0.5,
    dividendPayable: seed * 0.3,
    longTermBorrowing: seed * 3,
    shareCapital: seed * 5,
    capitalReserve: seed * 2,
    surplusReserve: seed * 0.5,
    unappropriatedProfit: seed * 1.5,
    minorityInterest: isParent ? 0 : seed * 0.3,
  };
  state.cf[companyId] = {
    cashFromSales: seed * 4,

    cashForTaxes: seed * 0.5,

function renderAIAnalysis(r) {
  const pl = r.pl;
  const bs = r.bs;
  const subs = state.companies.filter(c => c.type === 'subsidiary');
  const totalAssets = (bs.currentAssetsTotal||0) + (bs.nonCurrentAssetsTotal||0);
  const totalLiab = (bs.currentLiabTotal||0) + (bs.nonCurrentLiabTotal||0);
  const parentEquity = (bs.shareCapital||0) + (bs.capitalReserve||0) + (bs.surplusReserve||0) + (bs.unappropriatedProfit||0);
  const totalEquity = parentEquity + (bs.minorityInterest||0);
  const revenue = pl.revenue || 0;
  const netProfit = pl.netProfit || 0;
  const parentNP = pl.parentNetProfit || netProfit;
  const minorityNP = pl.minorityProfit || 0;

  const analysis = [
    {
      icon: '📊', title: '合并范围分析',
      content: `本次合并报表涵盖 ${state.companies.length} 个主体，其中母公司 1 家（${state.companies.find(c=>c.type==='parent')?.name || '母公司'}），
子公司 ${subs.length} 家：${subs.map(s=>`${s.name}（持股${s.ownership}%）`).join('、')}。

${subs.some(s=>s.ownership<100) ? '存在少数股东权益和少数股东损益，需在合并报表中单独列示。' : '各子公司均为全资子公司，无少数股权。'}`
    },
    {
      icon: '💰', title: '合并盈利能力分析',
      content: `合并营业收入 ${fmt(revenue)} 元，净利润 ${fmt(netProfit)} 元。
净利润率 = ${revenue ? ((netProfit/revenue)*100).toFixed(2) + '%' : '—'}

利润归属：
- 归属于母公司所有者的净利润：${fmt(parentNP)} 元
- 少数股东损益：${fmt(minorityNP)} 元`
    },
    {
      icon: '🏛️', title: '合并资产负债分析',
      content: `合并资产总计 ${fmt(totalAssets)} 元，
合并负债合计 ${fmt(totalLiab)} 元，
所有者权益合计 ${fmt(totalEquity)} 元（其中：归属于母公司 ${fmt(parentEquity)} 元，少数股东权益 ${fmt(bs.minorityInterest||0)} 元）。

资产负债率 = ${totalAssets ? ((totalLiab/totalAssets)*100).toFixed(2) + '%' : '—'}
归属于母公司每股净资产 = ${bs.shareCapital ? (parentEquity/bs.shareCapital).toFixed(2) + '元/股' : '—'}`
    },
    {
      icon: '🔄', title: '抵销分录汇总',
      content: `本次共生成 ${state.aiExplanations.length} 笔抵销分录：
${state.aiExplanations.map((e,i) => `${i+1}.【${e.type}】${e.detail}`).join('\n')}

${state.ic.sales.length > 0 ? `内部销售抵销金额合计：¥${fmtFull(state.ic.sales.reduce((s,t)=>s+parseNum(t.amount),0))} 元` : ''}
${state.ic.arap.length > 0 ? `内部往来抵销金额合计：¥${fmtFull(state.ic.arap.reduce((s,t)=>s+parseNum(t.amount),0))} 元` : ''}
${state.ic.dividends.length > 0 ? `内部股利抵销金额合计：¥${fmtFull(state.ic.dividends.reduce((s,t)=>s+parseNum(t.amount),0))} 元` : ''}`
    },
    {
      icon: '⚠️', title: '编制注意事项',
      content: `1. 【投资与权益抵销】确认子公司净资产时，应以购买日公允价值为基础，注意评估增值部分的折旧/摊销调整。

3. 【连续编制】本年度合并利润表中的"年初未分配利润"应与上年度合并资产负债表中的"未分配利润"一致。
4. 【现金流抵销】母子公司之间的资金划拨属于内部往来，不产生现金流，在合并现金流量表中应抵销。
5. 【外币折算】若有境外子公司，还需考虑外币报表折算差额。`
    }
  ];

  return `

}

function exportConsolidated() {
  const r = state.consolidated || calculateConsolidated();
  const bs = r.bs;
  const pl = r.pl;
  
  let content = `${state.groupName} 合并财务报表\n`;
  content += `${state.reportPeriod}\n\n`;
  content += `=== 合并资产负债表 ===\n`;
  content += `流动资产合计: ${fmtFull(bs.currentAssetsTotal || 0)}\n`;
  content += `非流动资产合计: ${fmtFull(bs.nonCurrentAssetsTotal || 0)}\n`;
  content += `资产总计: ${fmtFull((bs.currentAssetsTotal||0)+(bs.nonCurrentAssetsTotal||0))}\n`;
  content += `流动负债合计: ${fmtFull(bs.currentLiabTotal || 0)}\n`;
  content += `非流动负债合计: ${fmtFull(bs.nonCurrentLiabTotal || 0)}\n`;
  content += `负债合计: ${fmtFull((bs.currentLiabTotal||0)+(bs.nonCurrentLiabTotal||0))}\n`;
  content += `归属母公司所有者权益: ${fmtFull((bs.shareCapital||0)+(bs.capitalReserve||0)+(bs.surplusReserve||0)+(bs.unappropriatedProfit||0))}\n`;
  content += `少数股东权益: ${fmtFull(bs.minorityInterest||0)}\n`;
  content += `所有者权益合计: ${fmtFull(((bs.shareCapital||0)+(bs.capitalReserve||0)+(bs.surplusReserve||0)+(bs.unappropriatedProfit||0))+(bs.minorityInterest||0))}\n\n`;
  content += `=== 合并利润表 ===\n`;
  content += `营业收入: ${fmtFull(pl.revenue||0)}\n`;
  content += `净利润: ${fmtFull(pl.netProfit||0)}\n`;
  content += `归属母公司净利润: ${fmtFull(pl.parentNetProfit||0)}\n`;
  content += `少数股东损益: ${fmtFull(pl.minorityProfit||0)}\n`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${state.groupName}_合并报表_${state.reportPeriod}.txt`;
  a.click(); URL.revokeObjectURL(url);
  showToast('✅ 合并报表已导出');
}

function exportData() {
  const data = { companies: [], bs: {}, pl: {}, ic: { sales: [], arap: [], dividends: [] }, meta: { groupName: '${state.groupName}', reportPeriod: '${state.reportPeriod}' } };
  
  // Export companies
  document.querySelectorAll('input[data-company][data-field]').forEach(el => {
    const id = el.dataset.company, field = el.dataset.field;
    let co = data.companies.find(c => c.id === id);
    if (!co) { co = { id }; data.companies.push(co); }
    if (el.type === 'number') co[field] = parseFloat(el.value) || 0;
    else co[field] = el.value;
  });
  
  // Export BS & PL
  ['bs', 'pl'].forEach(table => {
    data[table] = {};
    document.querySelectorAll('input[data-table="' + table + '"]').forEach(el => {
      const cid = el.dataset.company, key = el.dataset.key;
      if (!data[table][cid]) data[table][cid] = {};
      data[table][cid][key] = parseFloat(el.value) || 0;
    });
  });
  
  // Export IC
  document.querySelectorAll('select[data-table="ic"]').forEach(el => {
    const idx = parseInt(el.dataset.idx), field = el.dataset.field;
    if (!data.ic._entries) data.ic._entries = [{},{},{},{},{}];
    if (el.value) data.ic._entries[idx][field] = el.value;
  });
  document.querySelectorAll('input[data-table="ic"]').forEach(el => {
    const idx = parseInt(el.dataset.idx), field = el.dataset.field;
    if (!data.ic._entries) data.ic._entries = [{},{},{},{},{}];
    if (field === 'amount') data.ic._entries[idx].amount = parseFloat(el.value) || 0;
    else data.ic._entries[idx][field] = el.value;
  });
  
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '合并报表数据_${state.groupName || "填写"}_${new Date().toISOString().slice(0,10)}.json';
  a.click();
  alert('数据已导出！可将JSON文件上传到合并报表助手系统进行导入。');

  const url = URL.createObjectURL(blob);

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const dropArea = document.getElementById('file-drop-area');
  if (dropArea) dropArea.style.borderColor = '#C8993A';
  
  const preview = document.getElementById('upload-preview');
  const nameEl = document.getElementById('upload-file-name');
  const sheetsEl = document.getElementById('upload-file-sheets');
  
  if (nameEl) nameEl.textContent = `📄 ${file.name}`;
  if (sheetsEl) sheetsEl.textContent = '已选择文件，正在读取...';
  if (preview) preview.style.display = 'block';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      uploadedFileData = data;
      if (sheetsEl) {
        const keys = Object.keys(data).filter(k => k !== 'meta' && k !== 'companies');
        sheetsEl.textContent = `检测到数据：公司${data.companies?.length || 0}个，报表类型：${keys.join('、')}`;
      }
      showToast('✅ 文件读取成功，请点击"解析并导入数据"');
    } catch (err) {
      if (sheetsEl) sheetsEl.textContent = `⚠️ 非标准模板格式，但仍尝试导入（${err.message}）`;
      uploadedFileData = e.target.result;
    }
  };
  reader.readAsText(file);
}

function parseUploadedFile() {
  if (!uploadedFileData) { showToast('请先选择文件'); return; }
  
  try {
    const data = typeof uploadedFileData === 'string' ? JSON.parse(uploadedFileData) : uploadedFileData;
    
    // Import companies
    if (data.companies) {
      data.companies.forEach(c => {
        const existing = state.companies.find(x => x.id === c.id);
        if (existing) {
          existing.name = c.name || existing.name;
          existing.shortName = c.shortName || existing.shortName;
          existing.ownership = c.ownership ?? existing.ownership;
        }
      });
    }
    
    // Import BS
    if (data.bs) {
      Object.keys(data.bs).forEach(cid => {
        if (!state.bs[cid]) state.bs[cid] = {};
        Object.keys(data.bs[cid]).forEach(k => {
          state.bs[cid][k] = data.bs[cid][k];
        });
      });
    }
    
    // Import PL
    if (data.pl) {
      Object.keys(data.pl).forEach(cid => {
        if (!state.pl[cid]) state.pl[cid] = {};
        Object.keys(data.pl[cid]).forEach(k => {
          state.pl[cid][k] = data.pl[cid][k];
        });
      });
    }
    
    // Import IC transactions
    if (data.ic?.sales) state.ic.sales = data.ic.sales;
    if (data.ic?.arap) state.ic.arap = data.ic.arap;
    if (data.ic?.dividends) state.ic.dividends = data.ic.dividends;
    
    // Import meta
    if (data.meta) {
      state.groupName = data.meta.groupName || state.groupName;
      state.reportPeriod = data.meta.reportPeriod || state.reportPeriod;
    }
    
    render();
    showToast('✅ 数据导入成功！请查看已填充的数据');
    goToStep(1);
  } catch (err) {
    showToast('❌ 导入失败：' + err.message);
  }
}

// ===== MAIN RENDER =====
function render() {
  renderNav();
  const main = document.getElementById('main-content');
  switch (state.currentStep) {
    case 0: main.innerHTML = renderStep0(); break;
    case 1: main.innerHTML = renderStep1(); break;
    case 2: main.innerHTML = renderStep2(); break;
    case 3: main.innerHTML = renderStep3(); break;
    case 4: main.innerHTML = renderStep4(); break;
    case 5: main.innerHTML = renderStep5(); break;
  }
}

function goToStep(n) {
  state.currentStep = n;
  render();
}

// ===== INIT =====
initStatements();
state._activeCompany = state.companies[0]?.id;
state._statementTab = 'bs';
state._icOpen = 'ic-sales';
state._resultTab = 'bs';
render();
</script>
